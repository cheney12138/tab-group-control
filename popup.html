<!DOCTYPE html>
<!-- TGS-BUILD: 2026-09-03 v3 (glass-search + sticky-fix) 验证缓存: popup 检查器里看到此注释=新代码 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ============================================================
     * 苹果风格色板: 所有颜色走 CSS 变量,深浅色各定义一套,
     * 规则层不再需要 !important 覆盖——切色板即切主题。
     * 色值取自 Apple HIG 系统色(浅色模式值 + 深色模式值)
     * ============================================================ */
    :root {
      color-scheme: light dark; /* 原生滚动条/checkbox 跟随深浅色 */
      --bg: #f5f5f7;                        /* 页面底(Apple 标志性浅灰) */
      --surface: #ffffff;                   /* 卡片面 */
      --fill: rgba(120, 120, 128, 0.10);    /* 填充底(输入框/分段控件容器) */
      --fill-2: rgba(120, 120, 128, 0.16);  /* 填充底·深一档 */
      --text: #1d1d1f;                      /* 主文字 */
      --text-2: #6e6e73;                    /* 次级文字 */
      --text-3: #8e8e93;                    /* 三级文字 */
      --placeholder: rgba(60, 60, 67, 0.32);
      --hairline: rgba(0, 0, 0, 0.10);      /* 发丝线(分隔线/描边) */
      --header-line: rgba(0, 0, 0, 0.055);  /* 组头底线: 比通用发丝线更淡(吸顶时叠在毛玻璃上,浓了像黑线) */
      --hover: rgba(0, 0, 0, 0.04);         /* 通用 hover 底 */
      --accent: #0071e3;                    /* Apple 蓝 */
      --accent-hi: #0077ed;
      --tint: rgba(0, 113, 227, 0.09);      /* 蓝色淡底(选中态) */
      --tint-2: rgba(0, 113, 227, 0.13);
      --ring: rgba(0, 122, 255, 0.20);      /* 聚焦光环 */
      --danger: #d70015;                    /* 危险·文字 */
      --danger-solid: #ff3b30;              /* 危险·实底 */
      --danger-bg: rgba(255, 59, 48, 0.10);
      --amber: #ff9500;                     /* 系统橙(脏状态/撤销条) */
      --seg-active: #ffffff;                /* 分段控件激活块 */
      --seg-shadow: 0 1px 3px rgba(0, 0, 0, 0.10);
      --header-bg: #f5f5f7;               /* 吸顶组头: 实底(毛玻璃只留给搜索框) */
      --header-hover: rgba(0, 0, 0, 0.04);
      --pop-bg: #ffffff;                  /* 气泡/推送条: 实底 */
      --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.14);
      --dot-ring: rgba(0, 0, 0, 0.06);      /* 竖色条细描边 */
      --btn-2: #6e6e73;                     /* 次级实底按钮 */
      --media-btn-bg: #ffffff;            /* 媒体控制圆钮: 实底白 */
      --media-btn-shadow: 0 2px 10px rgba(0, 0, 0, 0.16);
      --push-shadow: 0 4px 18px rgba(0, 0, 0, 0.12); /* 推送胶囊的柔和投影 */
      --search-bg: rgba(255, 255, 255, 0.48);    /* 搜索框毛玻璃底(未聚焦) */
      --search-bg-focus: rgba(255, 255, 255, 0.68); /* 聚焦: 更实一档,玻璃不关 */
      --plate-bg: rgba(245, 245, 247, 0.55);    /* 磨砂底板: 半透,行从下面滚过被糊出 */
      --tag-hot-c: #248a3d;   --tag-hot-bg: rgba(52, 199, 89, 0.13);
      --tag-info-c: #0066cc;  --tag-info-bg: rgba(0, 113, 227, 0.10);
      --tag-mid-c: #6e6e73;   --tag-mid-bg: rgba(120, 120, 128, 0.12);
      --tag-stale-c: #b25000; --tag-stale-bg: rgba(255, 149, 0, 0.13);
      --tag-zombie-c: #d70015; --tag-zombie-bg: rgba(255, 59, 48, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --surface: #2c2c2e;
        --fill: rgba(120, 120, 128, 0.22);
        --fill-2: rgba(120, 120, 128, 0.32);
        --text: #f5f5f7;
        --text-2: #98989d;
        --text-3: #7c7c80;
        --placeholder: rgba(235, 235, 245, 0.38);
        --hairline: rgba(255, 255, 255, 0.12);
        --header-line: rgba(255, 255, 255, 0.07);
        --hover: rgba(255, 255, 255, 0.06);
        --accent: #0a84ff;
        --accent-hi: #3395ff;
        --tint: rgba(10, 132, 255, 0.16);
        --tint-2: rgba(10, 132, 255, 0.22);
        --ring: rgba(10, 132, 255, 0.32);
        --danger: #ff453a;
        --danger-solid: #ff453a;
        --danger-bg: rgba(255, 69, 58, 0.16);
        --amber: #ff9f0a;
        --seg-active: #5e5e62;
        --seg-shadow: none;
        --header-bg: #1c1c1e;
        --header-hover: rgba(255, 255, 255, 0.06);
        --pop-bg: #2c2c2e;
        --shadow-pop: 0 10px 32px rgba(0, 0, 0, 0.6);
        --dot-ring: rgba(255, 255, 255, 0.10);
        --btn-2: #5b5b60;
        --media-btn-bg: #404042;
        --media-btn-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
        --push-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
        --search-bg: rgba(255, 255, 255, 0.07);  /* 深色下白玻璃微透(未聚焦) */
        --search-bg-focus: rgba(255, 255, 255, 0.12); /* 聚焦: 微实一档 */
        --plate-bg: rgba(28, 28, 30, 0.60);     /* 深色磨砂底板 */
        --tag-hot-c: #30d158;   --tag-hot-bg: rgba(48, 209, 88, 0.18);
        --tag-info-c: #409cff;  --tag-info-bg: rgba(10, 132, 255, 0.22);
        --tag-mid-c: #98989d;   --tag-mid-bg: rgba(120, 120, 128, 0.26);
        --tag-stale-c: #ff9f0a; --tag-stale-bg: rgba(255, 159, 10, 0.18);
        --tag-zombie-c: #ff453a; --tag-zombie-bg: rgba(255, 69, 58, 0.16);
      }
    }
    /* 弹窗整体上浮入场: 打开瞬间 translateY(4px)→0 + 淡入,
     * 叠在 Chrome popup 自身的出现动画之上,更顺滑 */
    @keyframes panel-enter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body {
      animation: panel-enter 0.14s ease-out;
      width: 480px;
      height: 520px;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }
    input {
      padding: 11px 14px;
      font-size: 14px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }
    input::placeholder { color: var(--placeholder); }
    /* 视图切换: 分段控件(macOS 系统设置同款)——填充灰容器 +
     * 白色浮起的激活块。它是磨砂底板的一部分(之间无间隙) */
    .view-tabs {
      display: flex;
      gap: 2px;
      margin: 2px 0 6px; /* 在底板内: 上留白由 plate 的 padding 提供 */
      padding: 2px;
      background: var(--fill);
      border-radius: 9px;
    }
    .view-tab {
      flex: 1;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 0 5px;
      color: var(--text-2);
      font-family: inherit;
      border-radius: 7px;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.01em;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active {
      color: var(--text);
      font-weight: 600;
      background: var(--seg-active);
      box-shadow: var(--seg-shadow);
    }
    .view-tabs-spacer { flex: 1; }
    /* 搜索框: 毛玻璃浮在列表上方(内容从框后掠过被糊出透明感)。
     * 需要 position: relative 建立 stacking context——backdrop-filter
     * 才能把下方兄弟元素(#results)纳入取景;聚焦时实白底,可读性优先 */
    /* 搜索框外层: 全宽磨砂底板。搜索框是圆角胶囊,上下滚动时内容会从
     * 圆角四周的缝隙漏出——底板把"搜索框+列表顶部"包成一块整体,
     * 缝隙处透出的是底板的磨砂而不是滚动的行。底板从分段控件下沿
     * 一直铺到与列表无缝衔接,本身带 blur(把底下掠过的行糊掉) */
    /* 底板把分段控件也一起包进来: 从分段控件上沿直接铺到列表,
     * 顶部无 margin(与上方控件零间隙),#results 负 margin 上叠
     * 的深度=底板总高,滚动内容从整块底板下方掠过 */
    .search-plate {
      position: relative;
      z-index: 6; /* 高于吸顶组头(5),低于推送条(40) */
      margin: 0 0 -1px; /* -1px 咬住列表容器顶,无接缝 */
      padding: 8px 12px 7px;
      background: var(--plate-bg);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      backdrop-filter: saturate(180%) blur(18px);
    }
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      background: var(--search-bg);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    /* 聚焦: 仍是玻璃,只是更实一档(文字可读性) + 蓝环。
     * 唤起弹窗 autofocus 意味着搜索框几乎永远处于聚焦态——
     * 若聚焦关玻璃,效果等于从不存在 */
    .search-wrap:focus-within {
      background: var(--search-bg-focus);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .search-wrap input { flex: 1; }
    /* 数据源按钮: 搜索框左缘的书签/历史入口,点击激活对应命令(等价 /b /h) */
    .src-btn {
      border: none;
      background: none;
      cursor: pointer;
      padding: 5px;
      margin-left: 4px;
      color: var(--text-3);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      transition: color 0.12s, background 0.12s;
    }
    .src-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* PNG 图标保留原色: 只用透明度做状态区分,不做灰度/反色滤镜
       (用户提供的是彩色图标,变色会破坏观感) */
    .src-btn img {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      transition: opacity 0.12s;
    }
    .src-btn:hover img,
    .src-btn.active img { opacity: 1; }
    .src-btn:hover { color: var(--accent); background: var(--tint); }
    /* 命令激活时对应按钮高亮 */
    .src-btn.active { color: var(--accent); background: var(--tint-2); }
    /* slash 命令胶囊: 打全 /b /h 后的前缀变成不可分割的命令标签 */
    .cmd-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 8px;
      padding: 2px 6px 2px 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--tint);
      border: 1px solid rgba(0, 113, 227, 0.28);
      border-radius: 5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      cursor: default;
      user-select: none;
    }
    .cmd-chip-x {
      cursor: pointer;
      color: var(--accent);
      font-size: 13px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
    }
    .cmd-chip-x:hover { background: var(--tint-2); }
    /* 历史条目半透明: /h 的结果非当前打开的标签,视觉降级区分 */
    .tab-item.history-item { opacity: 0.62; }
    .tab-item.history-item:hover, .tab-item.history-item.active { opacity: 1; }
    .settings-btn {
      border: none;
      background: none;
      cursor: pointer;
      padding: 7px;
      color: var(--text-3);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-btn svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* 按钮内 PNG 图标(用户提供的彩色图标): 原色显示,透明度做状态 */
    .settings-btn img {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      transition: opacity 0.12s;
    }
    .settings-btn:hover img { opacity: 1; }
    .settings-btn:hover { background: var(--hover); color: var(--text); }
    /* 快捷键悬浮气泡: hover 问号按钮时弹出,不占布局 */
    #helpBtn { position: relative; }
    .help-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 10;
      background: var(--pop-bg);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
      padding: 10px 14px;
      width: 260px;
      cursor: default;
    }
    #helpBtn:hover .help-popover,
    .help-popover:hover { display: block; }
    .help-popover::before {
      content: '';
      position: absolute;
      top: -5px;
      right: 14px;
      width: 8px;
      height: 8px;
      background: var(--pop-bg);
      border-left: 1px solid var(--hairline);
      border-top: 1px solid var(--hairline);
      transform: rotate(45deg);
    }
    /* 设置面板: 全屏覆盖层(不再挤压 tab 列表),自带关闭按钮 */
    .settings-panel {
      position: absolute;
      inset: 0;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding: 14px 16px 16px;
      font-size: 12px;
      display: none;
      background: var(--bg);
      overflow-y: auto;
    }
    .settings-panel.open { display: block; }
    .settings-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }
    .settings-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .settings-close-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-3);
      font-size: 15px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .settings-close-btn:hover { background: var(--hover); color: var(--text); }
    .settings-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      user-select: none;
    }
    .settings-panel .hint { margin-top: 8px; color: var(--text-3); }
    /* 自动分组规则编辑器: 对齐主列表的紧凑风格,无大圆角 */
    .rules-header {
      margin-top: 14px;
      font-weight: 600;
      color: var(--text-2);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .rules-list {
      margin-top: 5px;
      max-height: 230px;
      overflow-y: auto;
      /* 右侧留出滚动条宽度,删除按钮(×)不被滚动条压住 */
      padding: 0 10px 0 0;
      scrollbar-gutter: stable;
    }
    .rule-group {
      padding: 7px 0 8px;
      border-bottom: 1px solid var(--hairline);
    }
    .rule-group:last-child { border-bottom: none; }
    .rule-group-name {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rule-group-name input {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      border: none;
      padding: 1px 2px;
      background: transparent;
      outline: none;
      font-family: inherit;
    }
    .rule-del-btn {
      border: none;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .rule-del-btn:hover { background: var(--danger-bg); color: var(--danger); }
    /* 域名芯片流: 每域名一枚 chip,×单独删,底部"+"补加 */
    .rule-hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .host-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text-2);
      background: var(--fill);
      border-radius: 4px;
      padding: 1px 3px 1px 6px;
      max-width: 100%;
    }
    .host-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .host-chip button {
      border: none;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .host-chip button:hover { color: var(--danger); background: var(--danger-bg); }
    .host-add-input {
      font-size: 10.5px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text-2);
      border: none;
      border-bottom: 1px dashed var(--hairline);
      background: transparent;
      outline: none;
      padding: 1px 2px;
      width: 130px;
    }
    .host-add-input:focus { border-bottom-color: var(--accent); }
    .rules-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .rules-add-btn, .rules-save-btn {
      flex: 1;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--text);
      font-size: 11.5px;
      font-family: inherit;
      padding: 4px 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .rules-add-btn:hover { border-color: var(--accent); color: var(--accent); }
    /* 保存按钮: Apple 主按钮样式(系统蓝实底白字) */
    .rules-save-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .rules-save-btn:hover { background: var(--accent-hi); }
    /* 脏状态: 规则被编辑未保存时,保存按钮转系统橙 + 轻微脉动,提醒保存 */
    .rules-save-btn.dirty {
      background: var(--amber);
      border-color: var(--amber);
      color: #fff;
      animation: save-pulse 1.6s ease-in-out infinite;
    }
    @keyframes save-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(255, 149, 0, 0); }
    }
    /* 面板标题旁的未保存圆点 */
    .dirty-dot {
      display: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      margin-left: 6px;
      vertical-align: 1px;
    }
    .dirty-dot.show { display: inline-block; }
    .settings-panel .hint a { color: var(--accent); text-decoration: none; }
    .clean-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin-top: 8px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--danger);
      font-size: 12px;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .clean-btn:hover { background: var(--danger-bg); border-color: var(--danger-solid); }
    .clean-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .shortcut-table {
      border-collapse: collapse;
      width: 100%;
    }
    .shortcut-table td {
      padding: 3px 0;
      font-size: 12px;
      color: var(--text-2);
    }
    .shortcut-table td:first-child {
      width: 60px;
      color: var(--text);
      font-weight: 600;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      white-space: nowrap;
    }
    #results {
      flex: 1;
      overflow-y: auto;
      /* 负 margin 上叠进磨砂底板(56px=底板总高): 滚动内容从底板
       * 正下方掠过,被半透明底板的 blur 糊出磨砂流动感。
       * 底板是不透明矩形整体,上叠不会漏缝(之前漏缝是搜索框
       * 圆角胶囊+独立光晕导致的)。
       * 顶部 padding 补回上叠高度,首行仍从底板下沿起 */
      margin-top: -56px;
      padding: 56px 0 4px;
    }
    /* 吸顶组头: 毛玻璃(半透明底 + backdrop blur),行从下面穿行时
     * 被糊掉而不是穿帮——比实底更有层次。垂直度量(5px 上下 padding +
     * 10.5px 字号)不能动: popup.js scrollPastSticky 按 23px 头高校正滚动 */
    .group-header {
      display: flex;
      align-items: center;
      gap: 7px;
      /* 注意不能有 margin-top: sticky 吸顶按 margin 边对齐滚动容器顶,
       * 顶部 margin 会变成吸顶后与搜索框之间的一条滚动缝(行从缝里穿过)。
       * 原顶部 4px 间距折叠进 padding-top(9px = 4px 间距 + 5px 原留白) */
      margin: 0 0 1px;
      padding: 9px 16px 5px;
      font-size: 10.5px;
      color: var(--text-2);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: color 0.12s, background 0.12s;
      position: sticky;
      /* top: 0 相对滚动容器视口顶(#results 可视区顶=搜索框底边)。
       * 组头吸顶时紧贴搜索框下缘;#results 的 49px 顶部 padding 属于
       * 滚动内容,会随滚动消失,不影响吸顶位置 */
      top: 0;
      z-index: 5;
      background: var(--header-bg);
      /* 无底线: 吸顶交接时新旧组头短暂叠加,1px 底线在叠加处会重复
       * 加深成"黑线"(叠的组头越多越明显)。组头实底与列表行的色差
       * 已足够分层,不再需要线 */
    }
    .group-header:hover { color: var(--text); background: var(--header-hover); }
    .caret {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--text-3);
      transition: transform 0.15s ease;
    }
    .caret svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .group-header.collapsed .caret { transform: rotate(-90deg); }
    .group-header.active { background: var(--tint) !important; color: var(--accent) !important; }
    .group-count {
      color: var(--text-3);
      font-weight: 500;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    /* 蒙层式媒体控制: hover 行时内容整体置灰淡出(真正的"覆盖"感),
     * 中央浮起圆形毛玻璃按钮(实底,非悬浮线条)。热区只在按钮 36px——
     * 行点击仍是切换标签,不会误触播放控制 */
    .media-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--media-btn-bg);
      box-shadow: var(--media-btn-shadow);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 2;
      pointer-events: none; /* 未浮现时不挡行点击 */
    }
    .tab-item:hover .media-overlay {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto; /* 热区生效: 仅此圆钮 */
    }
    /* 行内容置灰淡出: 图标和文字降到近灰阶,覆盖感(带过渡) */
    .tab-item.has-media .icon-wrap,
    .tab-item.has-media .tab-info {
      transition: opacity 0.15s, filter 0.15s;
    }
    .tab-item.has-media:hover .icon-wrap,
    .tab-item.has-media:hover .tab-info {
      opacity: 0.18;
      filter: saturate(0);
    }
    .media-overlay:hover {
      background: var(--accent);
      color: #fff;
    }
    .media-overlay svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: currentColor;
      stroke-width: 2;
    }
    /* 关闭按钮层级最高: 置灰/浮钮都不挡它 */
    .close-btn { z-index: 3; }
    /* 组头迷你条形图: 长度∝组内标签数,跟随组色 */
    .group-bar {
      height: 3px;
      min-width: 10px;
      max-width: 40px;
      border-radius: 2px;
      margin-left: auto;
      margin-right: 8px;
      background: currentColor;
      opacity: 0.4;
      flex-shrink: 0;
    }
    /* 分组色标: 竖色条(标签侧脊隐喻),比方块精致;高度=文字行高,
     * 底色透出细描边增强对比 */
    .group-dot {
      width: 3px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1.5px var(--dot-ring);
    }
    /* 列表行 stagger 入场: 逐行淡入+上浮,每行延迟 8ms(Raycast 式质感)。
     * 只动 opacity/transform,不触发布局;搜索重渲染同样生效 */
    .tab-item, .group-header {
      animation: row-enter 0.16s ease-out backwards;
    }
    @keyframes row-enter {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tab-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 12px 7px 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 0 6px;
      transition: background 0.12s;
      position: relative;
    }
    /* 选中态: 左侧 3px 主色细节条 + 极淡底色,克制但有存在感 */
    .tab-item::before {
      content: '';
      position: absolute;
      left: 0; top: 20%;
      width: 3px; height: 60%;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.12s;
    }
    .tab-item:hover { background: var(--hover); }
    .tab-item.active { background: var(--tint); }
    .tab-item.active::before { opacity: 1; }
    /* 选中时 favicon 微弹(触感反馈,1.08 察觉不到但手眼协调更顺) */
    .tab-item.active .icon-wrap { transform: scale(1.08); }
    .tab-item .icon-wrap { transition: transform 0.12s ease; }
    .tab-item img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px; /* 对齐标题行基线,与两行文字的顶部对齐 */
    }
    /* favicon 容器 + 重复合并角标: 右上角迷你数字圆点(深底白字) */
    .icon-wrap {
      position: relative;
      flex-shrink: 0;
      margin-top: 2px; /* 对齐标题行基线 */
    }
    .dup-badge {
      position: absolute;
      right: -5px;
      top: -5px;
      min-width: 11px;
      height: 11px;
      line-height: 11px;
      text-align: center;
      font-size: 8px;
      font-weight: 700;
      color: #fff;
      background: var(--amber);
      border-radius: 6px;
      padding: 0 2.5px;
      border: 1.5px solid var(--bg);
      pointer-events: none;
      z-index: 2;
      font-variant-numeric: tabular-nums;
      box-sizing: content-box;
    }
    .tab-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tab-item .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      line-height: 1.35;
    }
    .tab-item .title mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }
    .tab-item .url {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: left;
      line-height: 1.3;
    }
    .tab-item .url mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }
    .last-used {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--tag-mid-c);
      background: var(--tag-mid-bg);
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 4px;
      margin-top: 3px; /* 行改为顶对齐后,tag 与标题行对齐 */
      white-space: nowrap;
      transition: opacity 0.1s;
    }
    .tab-item:hover .last-used,
    .tab-item.active .last-used {
      opacity: 0;
    }
    .close-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%) translateX(6px);
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      background: var(--fill-2);
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.1s, transform 0.1s;
    }
    .close-btn svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .tab-item:hover .close-btn,
    .tab-item.active .close-btn {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .close-btn:hover {
      background: var(--danger-solid);
      color: #fff;
    }
    /* 最近使用时间 tag 五档: 当前 > 热门(10分钟) > 今日 / 近期 > 僵尸。
     * 颜色用 Apple 系统色的文字/淡底组合,冷暖渐进 */
    .last-used.hot { color: var(--tag-hot-c); background: var(--tag-hot-bg); font-weight: 600; }
    .last-used.today { color: var(--tag-info-c); background: var(--tag-info-bg); }
    .last-used.recent { color: var(--tag-mid-c); background: var(--tag-mid-bg); }
    .last-used.stale { color: var(--tag-stale-c); background: var(--tag-stale-bg); }
    .last-used.zombie { color: var(--tag-zombie-c); background: var(--tag-zombie-bg); }
    .last-used.current { color: var(--tag-info-c); background: var(--tag-info-bg); font-weight: 600; }
    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--text-3);
    }
    /* ============================================================
     * 推送式通知(iOS push 同款): 底部悬浮胶囊,顺手可点。
     * 三种形态共用——toast(纯文字)/undo(带撤销按钮)/confirm(确认+取消)。
     * 出现: 底部上滑+轻微缩放(回弹曲线);消失: 下滑+淡出;
     * 连续 push 时旧的先让位下滑(让位动画用独立的 push-away)。
     * 视觉刻意淡: 次级文字色 + 柔投影,提示但不抢焦点
     * ============================================================ */
    .push-stack {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40; /* 高于设置覆盖层(20) */
      width: min(440px, calc(100% - 24px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none; /* 栈本身透传,子条目各自接事件 */
    }
    .push-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      font-size: 12.5px;
      color: var(--text-2);
      background: var(--pop-bg);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      box-shadow: var(--push-shadow);
      cursor: default;
      pointer-events: auto;
      animation: push-in 0.38s cubic-bezier(0.32, 1.6, 0.45, 1) both;
    }
    /* 让位动画: 旧条目被新条目顶走时下滑消失 */
    .push-banner.push-away {
      animation: push-out-top 0.22s ease-in forwards;
    }
    /* 自动消失: 下滑+淡出 */
    .push-banner.push-gone {
      animation: push-out 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    /* 底部上滑入场(通知从屏幕下缘升起) */
    @keyframes push-in {
      from { opacity: 0; transform: translateY(16px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* 下滑退场(从哪来回哪去) */
    @keyframes push-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(16px) scale(0.96); }
    }
    /* 让位: 被新条目顶走时向下滑出视野 */
    @keyframes push-out-top {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(14px); }
    }
    /* 条目内文字: 主体白色(暗色模式跟随主题),副信息灰 */
    .push-msg {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    /* 撤销/确认按钮: 苹果通知的同款文字按钮(蓝字无边框,非实底) */
    .push-action {
      flex-shrink: 0;
      border: none;
      background: none;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .push-action:hover { background: var(--tint); }
    .push-action.secondary { color: var(--text-2); }
    /* 撤销倒计时: 底部细进度条(收窄居中,系统蓝),走完即失效 */
    .push-progress {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 4px;
      height: 2px;
      border-radius: 1px;
      background: var(--accent);
      opacity: 0.55;
      transform-origin: left;
      animation: undo-countdown 6s linear forwards;
    }
    @keyframes undo-countdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
    /* 尊重系统级"减少动效"偏好: 关掉所有入场/脉动/推送动画。
     * !important 用于覆盖 stagger 行的内联 animation-delay(JS 用
     * el.style.animationDelay 设的内联值优先级高于样式表,不加 !important
     * 逐行 stagger 仍会跑)。过渡也一并归零,hover/聚焦无渐变但功能不受影响 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0s !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="search-plate">
  <div class="view-tabs">
    <button class="view-tab active" data-view="grouped">分组</button>
    <button class="view-tab" data-view="recent">最近使用</button>
    <button class="view-tab" data-view="current">当前窗口</button>
  </div>
  <div class="search-wrap">
    <button id="bmBtn" class="src-btn" title="搜索书签 (/b)">
      <img src="img/bookmarks.png" alt="书签">
    </button>
    <button id="histBtn" class="src-btn" title="搜索历史 (/h)">
      <img src="img/history.png" alt="历史">
    </button>
    <span id="cmdChip" class="cmd-chip" style="display:none">
      <span id="cmdChipText"></span>
      <span class="cmd-chip-x" title="移除命令 (⌫)">×</span>
    </span>
    <input id="search" type="text" placeholder="搜索标签页…" autofocus>
    <button id="helpBtn" class="settings-btn" title="快捷键">
      <img src="img/help.png" alt="?">
      <div class="help-popover">
        <table class="shortcut-table">
          <tr><td>↑ ↓</td><td>上下选择(跨分组)</td></tr>
          <tr><td>← →</td><td>收起 / 展开分组</td></tr>
          <tr><td>Tab</td><td>切换视图</td></tr>
          <tr><td>Enter</td><td>切换到选中标签</td></tr>
          <tr><td><span class="k-c"></span>C</td><td>复制选中标签的 URL</td></tr>
          <tr><td><span class="k-c"></span>⌫</td><td>删除选中项(有重复时先逐份删副本)</td></tr>
          <tr><td><span class="k-c"></span>Z</td><td>撤销刚才的关闭</td></tr>
          <tr><td><span class="k-c"></span>⇧K</td><td>清理 7 天未用的标签</td></tr>
          <tr><td>Esc</td><td>清空搜索词 / 关闭</td></tr>
          <tr><td><span class="k-c"></span>E</td><td>呼出本弹窗(全局)</td></tr>
          <tr><td>/b /h</td><td>搜索 书签 / 历史(输入命令后接关键词)</td></tr>
        </table>
      </div>
    </button>
    <button id="settingsBtn" class="settings-btn" title="设置">
      <img src="img/settings.png" alt="⚙">
    </button>
  </div>
  </div>
  <div id="settingsPanel" class="settings-panel">
    <div class="settings-panel-head">
      <span class="settings-panel-title">设置<span id="rulesDirtyDot" class="dirty-dot" title="规则有未保存的修改"></span></span>
      <button id="settingsCloseBtn" class="settings-close-btn" title="关闭 (Esc)">✕</button>
    </div>
    <label>
      <input type="checkbox" id="optFuzzy"> 模糊匹配(关闭后仅子串匹配)
    </label>
    <label>
      <input type="checkbox" id="optShowUrl"> 始终显示 URL 行
    </label>
    <label>
      <input type="checkbox" id="optAutoGroup"> 自动分组(新标签按规则域名归组)
    </label>
    <label>
      <input type="checkbox" id="optOthersGroup"> 未分组标签归入 Others(未命中规则的域名)
    </label>
    <label style="margin-top:6px">
      删除标签的按键
      <select id="optDeleteKey" style="margin-left:auto;font-size:11px;font-family:inherit;padding:2px 4px;border:1px solid var(--hairline);border-radius:5px;background:var(--surface);color:var(--text)">
        <option value="cmd-bs">⌘ + 退格</option>
        <option value="bs">退格(光标在起点时)</option>
        <option value="dbl-bs">双击退格</option>
      </select>
    </label>
    <button id="cleanBtn" class="clean-btn">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      清理僵尸标签(7 天以上未使用,<span class="k-cmd"></span>⇧K)
    </button>
    <div class="rules-header">自动分组规则(域名 → 组)</div>
    <div id="rulesList" class="rules-list"></div>
    <div class="rules-actions">
      <button id="addRuleBtn" class="rules-add-btn">+ 新增组</button>
      <button id="saveRulesBtn" class="rules-save-btn">保存规则</button>
    </div>
    <div class="hint">
      全局快捷键(呼出弹窗)请在 <a href="#" id="shortcutLink">chrome://extensions/shortcuts</a> 中自定义,默认 <span class="k-cmd"></span>E
    </div>
  </div>
  <div id="results"></div>
  <div id="pushStack" class="push-stack"></div>
  <script src="pinyin-data.js"></script>
  <script src="popup.js"></script></body>
</html>
